name: self-test

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate plugin manifests and knowledge graph JSON
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json skills/functional-qa-engineer/knowledge/graph.json; do
            python -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Non-browser self-test (gates, generators, knowledge graph)
        run: python -I skills/functional-qa-engineer/selftest/selftest.py
      - name: GRAPH.md is up to date with graph.json
        run: |
          cd skills/functional-qa-engineer
          python -I scripts/kb.py render --out /tmp/GRAPH.md
          diff <(sed 3d knowledge/GRAPH.md) <(sed 3d /tmp/GRAPH.md) && echo "GRAPH.md up to date" \
            || { echo "::error::GRAPH.md is stale - run: python3 scripts/kb.py render"; exit 1; }
      - name: Browser self-test harness builds
        run: python -I skills/functional-qa-engineer/selftest/build_selftest.py /tmp/selftest.js && test -s /tmp/selftest.js
